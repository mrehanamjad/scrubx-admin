name: ScrubX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  install-and-verify:
    name: Typecheck, Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck (tsc)
        run: npx tsc --noEmit

      - name: Lint & Static Regression Guards (TEST-006)
        run: npm run lint

      - name: Next.js Production Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Security Audit (High & Critical)
        run: npm audit --audit-level=high

  schema-parity:
    name: PostgreSQL Schema Parity & Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: scrubx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/scrubx_test
        run: npm run db:migrate

      - name: Verify Schema Parity
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/scrubx_test
        run: npm run db:parity

  test:
    name: Automated Unit & Concurrency Test Harness
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: scrubx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Migrations & Seed Reference Data
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/scrubx_test
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Run Vitest Suite (Unit, Matrix, DTO, Security, Concurrency)
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/scrubx_test
        run: npm test
